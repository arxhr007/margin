name: build

# Runs when a release tag (v*) is pushed, or by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# "contents: write" lets the release job attach the binaries to a GitHub release.
permissions:
  contents: write

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked

  windows:
    name: build (windows x86_64)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked

      # Code signing through SignPath (free for open source, certificate by SignPath Foundation).
      # It switches on once the repository variable SIGNPATH_ORGANIZATION_ID and the secret
      # SIGNPATH_API_TOKEN exist; until then releases are built unsigned. See docs/signing.md.
      - name: upload the unsigned exe for signing
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: target/release/margin.exe
      - name: sign with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'margin' }}
          # release tags go through release signing (an approver confirms each request in SignPath);
          # manual runs from the Actions tab use test signing
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          $exe = if (Test-Path signed\margin.exe) { 'signed\margin.exe' } else { 'target\release\margin.exe' }
          Copy-Item $exe dist\margin.exe
          $sig = Get-AuthenticodeSignature dist\margin.exe
          Write-Host "signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ('${{ vars.SIGNPATH_ORGANIZATION_ID }}' -and $sig.Status -eq 'NotSigned') { throw 'signing is configured but margin.exe came back unsigned' }
          $hash = (Get-FileHash dist\margin.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("dist/margin.exe.sha256", "$hash  margin.exe`n")
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    name: build (linux ${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    # the arm64 runner is newer; if it is unavailable the x86_64 release still goes out
    continue-on-error: ${{ matrix.arch == 'aarch64' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@v4
      - name: build a static binary (musl), so it runs on any distribution
        run: |
          rustup target add ${{ matrix.arch }}-unknown-linux-musl
          cargo build --release --locked --target ${{ matrix.arch }}-unknown-linux-musl
      - name: package
        run: |
          mkdir dist
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/margin dist/margin-linux-${{ matrix.arch }}
          cd dist && sha256sum margin-linux-${{ matrix.arch }} > margin-linux-${{ matrix.arch }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  release:
    name: attach to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: create the release if needed, then upload the binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Margin $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
